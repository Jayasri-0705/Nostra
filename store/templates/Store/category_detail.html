{% extends 'Store/main.html' %}

{% block content %}

<section class="page-head">
    <a href="{% url 'collections' %}" class="back-link">&larr; All collections</a>
    <h1>{{ category.name }}</h1>
    <p>{{ products|length }} item{{ products|length|pluralize }}</p>
</section>

<div class="product-grid">
    {% for product in products %}
        <a href="{% url 'product_detail' product.id %}" class="product-card">
            <img src="{{ product.image_url }}" alt="{{ product.name }}">
            <p>{{ product.name }}</p>
        </a>
    {% empty %}
        <p class="empty-note">No {{ category.name }} dresses yet.</p>
    {% endfor %}
</div>

{% endblock content %}
