{% extends 'Store/main.html' %}

{% block content %}
    <h2>Welcome to the Store</h2>

    {% for product in products %}
        <div>
           {% if product.image %}
              <img src="{{ product.image.url }}" width="200">
           {% endif %}
            <h3>{{product.name}}</h3>
            <p>{{product.description}}</p>
            <p>Price: ₹{{ product.price }}</p>
        </div>
    {% empty %}
        <p>No products yet.</p>
    {% endfor %}         
   
{% endblock content %}
