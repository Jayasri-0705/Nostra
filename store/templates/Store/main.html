{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nostra{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    {% comment %} <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"> {% endcomment %}
</head>
<body>

    <header class="navbar">
        <a href="{% url 'store' %}" class="logo">Nostra</a>
        <nav>
            <a href="{% url 'store' %}">Home</a>
            <a href="{% url 'collections' %}">Collections</a>
            <a href="{% url 'contact' %}">Contact</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer class="footer">
        <h3>Nostra</h3>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        <p>@2025 Nostra.com</p>
    </footer>

</body>
</html>
